# bin/install.sh settings for deadman.switch (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: settings go in $STATE_DIR/app.env, written from the logicsrc
# vault profullstack/deadman-switch--prod (DATABASE_URL, DEADMAN_SECRET,
# RESEND_API_KEY, VAPID_*, COINPAY_*, TELNYX_*).
#
# DATABASE_URL points at the box's shared self-hosted Postgres (docker
# supabase-db on 127.0.0.1:5432), so POSTGRES=0: install.sh must not try to
# install a second Postgres on a port that is taken.
#
# DOMAINS is empty on purpose: deadman.switch is a Moshpit name, so there is no
# Let's Encrypt certificate to get. Its nginx vhost (/etc/moshpit/templates/
# deadman.switch.conf) proxies to PORT with the Moshpit-issued certificate.
APP=deadman-switch
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/server.ts
PORT=8801
HEALTH_PATH=/health
DOMAINS=
POSTGRES=0
ACCESS_LOG=off
